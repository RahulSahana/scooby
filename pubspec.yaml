name: scooby
description: "A Flutter project for my EV Scooty."

publish_to: 'none'
version: 3.0.1+3

environment:
  sdk: ^3.11.4


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  wave: ^0.2.2
  flutter_blue_plus: ^2.3.3
  permission_handler: ^12.0.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  package_info_plus: ^8.2.1
  geolocator: ^14.0.2
  flutter_local_notifications: ^22.3.1
  url_launcher: ^6.3.3
  mappls_gl: 2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - lib/assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/logo.png"
  min_sdk_android: 21

  adaptive_icon_background: "#D8D0D5"
  adaptive_icon_foreground: "lib/assets/logo_foreground.png"
  adaptive_icon_monochrome: "lib/assets/logo_monochrome.png"